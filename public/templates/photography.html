{{ define "content" }}
<section class="photography-intro">
    <h1 class="section-title">&gt; Photography</h1>
    <p class="section-description">Some of my favorite photos I've taken. Tap any photo to view it larger.</p>
</section>

<div class="photo-grid">
    {{range .Photos}}
    <figure class="photo-item">
        <img src="{{.URL}}" alt="{{.Description}}" loading="lazy" decoding="async">
        <figcaption class="photo-name">{{.Description}}</figcaption>
    </figure>
    {{end}}
</div>
{{ end }}
